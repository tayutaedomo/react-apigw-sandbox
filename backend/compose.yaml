services:
  api:
    image: sandbox-api:local
    platform: linux/amd64
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8000:8080"
    environment:
      POWERTOOLS_LOG_LEVEL: ${POWERTOOLS_LOG_LEVEL:-INFO}
