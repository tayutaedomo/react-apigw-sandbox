services:
  api:
    image: sandbox-api:local
    platform: linux/amd64
    init: true
    # アプリの書き換えを防ぎ、書き込み先を /tmp に限定する。
    read_only: true
    tmpfs:
      - /tmp
    # 不要な Linux capability とプロセスの権限昇格を禁止する。
    # この制限は Compose 実行時のみで、Lambda へは自動適用されない。
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8000:8080"
    environment:
      POWERTOOLS_LOG_LEVEL: ${POWERTOOLS_LOG_LEVEL:-INFO}
